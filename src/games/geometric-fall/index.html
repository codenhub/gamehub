<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="game.geometricFall.pageTitle">Geometric fall | GameHub</title>
    <link rel="stylesheet" href="../../_ui/styles/index.css" />
    <script type="module" src="../../_ui/scripts/index.ts"></script>
    <script src="../../_ui/components/index.js" type="module" defer></script>
    <script src="./index.ts" type="module" defer></script>
  </head>
  <body>
    <gh-header header-title="home.game.geometricFall=Geometric fall" backBtn></gh-header>

    <main class="flex size-full flex-1 justify-center p-4">
      <!-- GAME CONTAINER -->
      <section class="flex h-auto w-full max-w-7xl flex-1 gap-4 max-sm:flex-col max-sm:items-center">
        <div class="flex h-full flex-col gap-4">
          <div class="flex items-center justify-between gap-4">
            <!-- CONTROLS -->
            <div class="flex gap-2">
              <button id="play" class="icon-btn">
                <gh-icon src="/assets/icons/play.webp"></gh-icon>
              </button>
              <button id="pause" class="icon-btn hidden">
                <div class="flex gap-1">
                  <div class="bg-primary-contrast h-4 w-1.5"></div>
                  <div class="bg-primary-contrast h-4 w-1.5"></div>
                </div>
              </button>
              <button id="stop" class="icon-btn hidden">
                <div class="bg-primary-contrast size-4" aria-label="Stop icon"></div>
              </button>
              <p class="ml-2">
                <span data-i18n="common.score">Score</span>
                :
                <span id="score">0</span>
              </p>
              <p>
                <span data-i18n="common.best">Best</span>
                :
                <span id="high-score">0</span>
              </p>
            </div>
            <!-- NEXT PIECE -->
            <div class="pixel-corner-lg-4 bg-border relative aspect-square size-24 p-1 sm:hidden">
              <p class="absolute top-1 left-1/2 z-10 -translate-x-1/2 text-base" data-i18n="common.next">Next:</p>
              <canvas class="pixel-corner-lg-4 bg-foreground next-canvas size-full"></canvas>
            </div>
          </div>
          <!-- GAME -->
          <div class="bg-border pixel-corner-lg-4 relative h-full p-1 sm:max-w-lg">
            <canvas id="game" class="pixel-corner-lg-4 bg-foreground size-full"></canvas>

            <!-- Start screen -->
            <div
              id="start-screen"
              class="bg-foreground/80 pixel-corner-lg-4 absolute inset-0 z-20 flex flex-col items-center justify-center gap-4"
            >
              <h2 class="text-center uppercase" data-i18n="game.geometricFall.title">Geometric Fall</h2>
              <p class="text-center" data-i18n="game.geometricFall.startHint">Clear lines to score points!</p>
              <button id="start-btn" class="primary-btn" data-i18n="common.play">Play</button>
            </div>

            <!-- Game over screen -->
            <div
              id="game-over-screen"
              class="bg-foreground/80 pixel-corner-lg-4 absolute inset-0 z-20 hidden flex-col items-center justify-center gap-2"
            >
              <h2 class="text-error" data-i18n="common.gameOver">GAME OVER</h2>
              <p class="mb-2 text-2xl">
                <span data-i18n="common.score">Score</span>
                :
                <span id="final-score">0</span>
              </p>
              <button id="restart-btn" class="primary-btn" data-i18n="common.tryAgain">Try Again</button>
            </div>
          </div>
        </div>

        <!-- DESKTOP CONTROLS -->
        <div class="hidden w-min flex-col gap-4 sm:flex">
          <div class="pixel-corner-lg-4 bg-border relative aspect-square w-full p-1">
            <p class="absolute top-1 left-1/2 z-10 -translate-x-1/2" data-i18n="common.next">Next:</p>
            <canvas class="next-canvas pixel-corner-lg-4 bg-foreground size-full"></canvas>
          </div>
          <div class="flex gap-4">
            <button class="icon-btn dropBtn size-12">
              <gh-icon src="/assets/icons/chevron-drop.webp" width="2rem"></gh-icon>
            </button>
            <button class="icon-btn rotateLeftBtn size-12">
              <gh-icon src="/assets/icons/rotate.webp" width="2rem"></gh-icon>
            </button>
            <button class="icon-btn rotateRightBtn size-12">
              <gh-icon src="/assets/icons/rotate-counter.webp" width="2rem"></gh-icon>
            </button>
          </div>
          <div class="flex gap-4">
            <button class="icon-btn downBtn size-12">
              <span class="flex rotate-180">
                <gh-icon src="/assets/icons/chevron-up.webp" width="2rem"></gh-icon>
              </span>
            </button>
            <button class="icon-btn leftBtn size-12">
              <span class="flex -rotate-90">
                <gh-icon src="/assets/icons/chevron-up.webp" width="2rem"></gh-icon>
              </span>
            </button>
            <button class="icon-btn rightBtn size-12">
              <span class="flex rotate-90">
                <gh-icon src="/assets/icons/chevron-up.webp" width="2rem"></gh-icon>
              </span>
            </button>
          </div>
        </div>

        <!-- MOBILE CONTROLS -->
        <div class="flex w-full justify-center gap-4 sm:hidden">
          <button class="icon-btn dropBtn size-12">
            <gh-icon src="/assets/icons/chevron-drop.webp" width="2rem"></gh-icon>
          </button>
          <button class="icon-btn rotateLeftBtn size-12">
            <gh-icon src="/assets/icons/rotate.webp" width="2rem"></gh-icon>
          </button>
          <button class="icon-btn rotateRightBtn size-12">
            <gh-icon src="/assets/icons/rotate-counter.webp" width="2rem"></gh-icon>
          </button>
          <button class="icon-btn downBtn size-12">
            <gh-icon src="/assets/icons/chevron-down.webp" width="2rem"></gh-icon>
          </button>
          <button class="icon-btn leftBtn size-12">
            <gh-icon src="/assets/icons/chevron-left.webp" width="2rem"></gh-icon>
          </button>
          <button class="icon-btn rightBtn size-12">
            <gh-icon src="/assets/icons/chevron-right.webp" width="2rem"></gh-icon>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
